# Copy this file's contents into .github/workflows/keepalive.yml in your fate-site repository
# (see the setup guide). It calls the database every 3 days so Supabase's free plan never pauses it.
name: keep Stavish awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping
        run: |
          URL=$(grep -o 'https://[^"]*supabase.co' config.js || true)
          KEY=$(grep -o 'supabaseAnonKey: "[^"]*"' config.js | cut -d'"' -f2 || true)
          if [ -z "$URL" ]; then echo "config.js not found"; exit 1; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
